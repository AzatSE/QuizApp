{% load static %}<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token }}">
<title>{% block title %}MiniKahoot{% endblock %}</title>
<link rel="stylesheet" href="{% static 'game/app.css' %}">
</head><body>
<header class="top">
  <a class="brand" href="{% url 'home' %}">⚡ MiniKahoot</a>
  <nav>
  {% if user.is_authenticated %}
    <a href="{% url 'dashboard' %}">Мои квизы</a>
    <form method="post" action="{% url 'logout' %}" class="inline">{% csrf_token %}<button class="link">Выйти ({{ user.username }})</button></form>
  {% else %}
    <a href="{% url 'login' %}">Войти</a> <a href="{% url 'signup' %}">Создать квиз</a>
  {% endif %}
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
<script src="{% static 'game/common.js' %}"></script>
{% block scripts %}{% endblock %}
</body></html>
